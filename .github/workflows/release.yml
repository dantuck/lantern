name: Release
# Merging the release PR that release-please keeps open on main bumps package.json, updates CHANGELOG.md, tags
# vX.Y.Z and publishes the GitHub release (see docs/releasing.md). Tags made with GITHUB_TOKEN do not start other
# workflows, so the checks for a published release run here, in the second job.
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  verify:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { ref: "${{ needs.release-please.outputs.tag_name }}" }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Local dev secrets (the e2e scripts sign in as this address)
        run: echo "BOOTSTRAP_MANAGER_EMAIL=mom@example.com" > .dev.vars
      - run: npm run verify
      - run: npm run verify:e2e
